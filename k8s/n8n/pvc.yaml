# PersistentVolumeClaim — n8n stores binary data (workflow files, user uploads,
# the encryption key file used internally) on disk.
#
# We use Azure Disk (managed-csi StorageClass) instead of Azure Files because
# Defender for Cloud's CSPM auto-disables `allowSharedKeyAccess` on auto-provisioned
# storage accounts, and Azure Files CSI mounts use SMB with shared keys.
# Azure Disk uses identity-based auth and isn't affected. See ADR 0012.
#
# Trade-off: Azure Disk is RWO (one node at a time), so the Deployment uses
# strategy: Recreate. For n8n's single replica that's fine. If we ever scale
# n8n horizontally (enterprise queue mode) we'd revisit.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: n8n
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi
  resources:
    requests:
      storage: 5Gi
