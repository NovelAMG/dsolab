# One-shot Job that creates the n8n database, user, and grants.
#
# Why a K8s Job (not a local `psql` script)?
#   - The pod already has network access to Postgres via the AllowAllAzureServices
#     firewall rule we configured in Phase 1B. No firewall changes needed.
#   - You don't have to install psql on your laptop.
#   - It's idempotent and auditable in Kubernetes.
#
# Secrets are read from a temp K8s Secret `postgres-bootstrap` that
# scripts/04-postgres-init.sh creates (and deletes) around this job's lifecycle.
# That secret holds the SQL admin password (from KV) and the new n8n password
# (freshly generated by the script).
#
# IMPORTANT: this manifest is NOT applied directly by kubectl. It's templated
# from scripts/04-postgres-init.sh which `kubectl apply`s it then waits for
# Complete. We commit it for visibility / version-control purposes.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
  namespace: n8n
spec:
  ttlSecondsAfterFinished: 600 # auto-clean 10 min after success
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: postgres-bootstrap
          command: ["/bin/sh", "-c"]
          # PGPASSWORD is read by psql automatically. We use heredoc + ON_ERROR_STOP
          # so the job fails loud if any statement errors.
          # CREATE USER + CREATE DATABASE are NOT idempotent in plain SQL, so we
          # use DO blocks / conditional logic.
          args:
            - |
              set -eu

              echo ">>> Connecting to Postgres as admin"
              export PGPASSWORD="$PG_ADMIN_PASSWORD"
              export PGSSLMODE=require

              # Create the n8n role if it doesn't exist; idempotent password update.
              psql -h "$PG_HOST" -U "$PG_ADMIN_USER" -d postgres -v ON_ERROR_STOP=1 <<EOF
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'n8n') THEN
                  CREATE ROLE n8n LOGIN PASSWORD '$N8N_DB_PASSWORD';
                ELSE
                  ALTER ROLE n8n WITH LOGIN PASSWORD '$N8N_DB_PASSWORD';
                END IF;
              END
              \$\$;
              EOF

              # Create the n8n database if missing. CREATE DATABASE can't run inside
              # a transaction block, so it's a separate connection.
              DB_EXISTS=$(psql -h "$PG_HOST" -U "$PG_ADMIN_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='n8n'")
              if [ "$DB_EXISTS" != "1" ]; then
                echo ">>> Creating database n8n owned by n8n"
                psql -h "$PG_HOST" -U "$PG_ADMIN_USER" -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE n8n OWNER n8n;"
              else
                echo ">>> Database n8n already exists, skipping create"
              fi

              # Grants — safe to re-run.
              psql -h "$PG_HOST" -U "$PG_ADMIN_USER" -d n8n -v ON_ERROR_STOP=1 <<EOF
              GRANT ALL PRIVILEGES ON DATABASE n8n TO n8n;
              GRANT ALL ON SCHEMA public TO n8n;
              EOF

              echo ">>> Done. n8n role + database ready."
