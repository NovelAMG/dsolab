# Internal ClusterIP service for n8n. NOT exposed publicly — that's 1E-c's job
# (Ingress + oauth2-proxy will route external HTTPS → this service).
# For now you reach n8n via `kubectl port-forward svc/n8n 5678:5678`.
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: n8n
  labels:
    app: n8n
spec:
  type: ClusterIP
  selector:
    app: n8n
  ports:
    - name: http
      port: 5678
      targetPort: 5678
      protocol: TCP
