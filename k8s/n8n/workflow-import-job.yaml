# K8s Job that imports the chat workflow into n8n's database, then activates it.
#
# n8n's CLI talks directly to its Postgres DB (using the same DB_POSTGRESDB_*
# env vars the n8n pod uses). It does NOT go through the HTTP API, so it
# doesn't need any session / auth — just DB access.
#
# Steps inside the container:
#   1. `n8n import:workflow --input=/workflow/chat.json` — upserts the workflow
#   2. Capture the inserted workflow ID
#   3. `n8n update:workflow --id=<id> --active=true` — activate it
#
# The ConfigMap `n8n-workflow-chat` is created by scripts/09 from
# n8n-workflows/chat.json. If you need to update the workflow, edit the JSON
# and re-run scripts/09 — the Job runs again and upserts.
apiVersion: batch/v1
kind: Job
metadata:
  name: import-chat-workflow
  namespace: n8n
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: n8n # same SA n8n uses (no need to invent another)
      restartPolicy: Never
      # CRITICAL: when a Pod has a same-namespace Service called `n8n`, k8s
      # auto-injects env vars like N8N_PORT=tcp://10.0.x.x:5678 that SHADOW
      # n8n's own N8N_PORT=5678 config and make the CLI crash with
      # "Invalid number value for N8N_PORT". Turn that off.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      containers:
        - name: n8n-cli
          image: docker.n8n.io/n8nio/n8n:1.69.0
          envFrom:
            - secretRef:
                name: n8n-secrets # DB_POSTGRESDB_* from KV (same as the n8n pod)
            - configMapRef:
                name: n8n-config
          env:
            # Avoid n8n trying to start the editor server / webhook server here.
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_TYPE
              value: "postgresdb"
            - name: DB_POSTGRESDB_SSL_ENABLED
              value: "true"
            - name: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
              value: "false"
            # Don't be noisy about settings-file perms in the Job container.
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "false"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo ">>> Importing workflow..."
              n8n import:workflow --input=/workflow/chat.json
              echo ""
              echo ">>> Done. Workflow imported."
              echo ">>> ACTIVATION: open the n8n UI at https://chat.<ip>.nip.io/ ,"
              echo ">>>             go to Workflows -> chat , and toggle Active (top right)."
              echo ">>>             (Auto-activation via CLI is brittle across n8n versions; one-click is reliable.)"
          volumeMounts:
            - name: workflow
              mountPath: /workflow
              readOnly: true
      # NOTE: we deliberately do NOT mount the n8n PVC (n8n-data). It's RWO
      # (Azure Disk, ADR 0012) and the n8n pod already has it. The CLI doesn't
      # need filesystem state — it just needs the same DB and the same
      # N8N_ENCRYPTION_KEY env var (both come from the n8n-secrets Secret).
      volumes:
        - name: workflow
          configMap:
            name: n8n-workflow-chat
