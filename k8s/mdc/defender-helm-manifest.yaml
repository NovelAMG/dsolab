# Source: microsoft-defender-for-containers/charts/microsoft-defender-for-containers-sensor/templates/crds/antimalware-crd.yml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    kubernetes.azure.com/managedby: mdc
  name: antimalwarepolicies.defender.microsoft.com
spec:
  group: defender.microsoft.com
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: AntimalwarePolicy is the Schema for the defender.microsoft.com security runtime, used by the Microsoft Defender for Cloud (MDC) Containers security agent.
        type: object
        properties:
          spec:
            type: object
            description: Specification of the policy.
            properties:
              rules:
                description: 'The list of antimalware scanning rules.'
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    hostRule:
                      type: object
                      properties:
                        name:
                          description: 'The name of the rule.'
                          type: string
                        priority:
                          description: 'The priority of the rule. A rule with a lower priority number will be evaluated first.'
                          type: integer
                        action:
                          description: 'Indicates the desired action for events that match the rule.'
                          type: string
                          enum: ["None", "Alert", "Block"]
                        excludedPaths:
                          description: 'Defines a list of filesystem paths (wildcards allowed at start or end) to be excluded from the rule.'
                          type: array
                          items:
                            type: string
                      required:
                        - name
                        - priority
                        - action
                    workloadRule:
                      type: object
                      properties:
                        name:
                          description: 'The name of the rule.'
                          type: string
                        priority:
                          description: 'The priority of the rule. A rule with a lower priority number will be evaluated first.'
                          type: integer
                        action:
                          description: 'Indicates the desired action for events that match the rule.'
                          type: string
                          enum: ["None", "Alert", "Block"]
                        excludeImageBinaries:
                          description: 'Indicates whether scanning should occur for binaries that exist in the deployed image'
                          default: false
                          type: boolean
                        excludedPaths:
                          description: 'Defines a list of filesystem paths (wildcards allowed at start or end) to be excluded from the rule.'
                          type: array
                          items:
                            type: string
                        scope:
                          description: 'Defines the conditions under which the rule applies.'
                          type: array
                          minItems: 1
                          items:
                            type: object
                            properties:
                              matcherType: 
                                description: 'Defines the the property of the event that will be tested. Possible properties are "namespace", "containerName", "podName", "image", "podLabels"'
                                type: string
                              anyOf:
                                description: 'Defines the list of patterns to test.'
                                type: array
                                items:
                                  type: string
                            required:
                              - matcherType
                              - anyOf 
                      required:
                        - name
                        - priority
                        - action
                  oneOf:
                    - required:
                        - hostRule
                    - required:
                        - workloadRule
              policyLastEditTime:
                description: 'The timestamp of when the policy was last edited.'
                type: string
                format: date-time
            required:
              - rules
  scope: Cluster
  names:
    shortNames:
      - mdcamwp
    kind: AntimalwarePolicy
    listKind: AntimalwarePolicyList
    plural: antimalwarepolicies
    singular: antimalwarepolicy
