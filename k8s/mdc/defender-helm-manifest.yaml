apiVersion: apps/v1
kind: Deployment
metadata:
  name: defender-admission-controller
  labels:
    app.kubernetes.io/name: defender-admission-controller
    app: defender-admission-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: defender-admission-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: defender-admission-controller
        app: defender-admission-controller
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: "defender-admission-controller-serviceaccount"
      
      hostNetwork: true
      
      tolerations:
        
        - key: "CriticalAddonsOnly"
          operator: "Exists"
        
        - key: "kubernetes.io/arch"
          operator: "Equal"
          value: "arm64"
          effect: "NoSchedule"
      
      containers:
      - name: defender-admission-controller        
        image: mcr.microsoft.com/mdc/prd/defender-admission-controller:1.0.168
        ports:
        - containerPort: 8443
        volumeMounts:
        - name: admission-tls
          mountPath: /etc/certs
          readOnly: true
        
        - mountPath: /var/log/microsoft-defender-for-cloud/traces
          name: mdc-traces-log
        - mountPath: /var/log/microsoft-defender-for-cloud/metrics
          name: mdc-metrics-log
        - mountPath: /var/log/microsoft-defender-for-cloud/collectors/GatingCollector
          name: mdc-podcollectors-log       
        command:
          - "/usr/bin/app"
        args:
          - "--certificate-path"
          - "/etc/certs"
          - "--service-name"
          - "defender-admission-controller"
          - "--secret-name"
          - "defender-admission-controller-server-cert"
          - "--require-signed-artifacts=true"
          - "--enable-priority=true"
          - '--cloud-provider=azure'
          
          
          - "--use-pull-secrets"
          
          
          
          
        env:
        
        - name: AZURE_RESOURCE_ID
          value: "/subscriptions/e406a385-feed-47ce-9194-13ed4f88f094/resourceGroups/rg-dsolab-sea/providers/Microsoft.ContainerService/managedClusters/aks-dsolab-sea"
        - name: AZURE_RESOURCE_REGION
          value: "southeastasia"
        - name: POD_NAMESPACE
          value: mdc
        - name: RATIFY_NAMESPACE
          value: mdc
        - name: IMAGE_VERSION
          value: "1.0.168"
        - name: CHART_VERSION
          value: "0.12.30"
        - name: MDM_ACCOUNT
          value: "RomeDetection"
        resources:
          limits:
            cpu: 600m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
              - key: type
                operator: NotIn
                values:
                - virtual-kubelet
      volumes:
      
      - name: admission-tls
        secret:
          secretName: defender-admission-controller-server-cert
      - name: mdc-metrics-log
        hostPath:
          path: /var/log/microsoft-defender-for-cloud/metrics
      - name: mdc-traces-log
        hostPath:
          path: /var/log/microsoft-defender-for-cloud/traces
      - name: mdc-podcollectors-log
        hostPath:
          path: /var/log/microsoft-defender-for-cloud/collectors/GatingCollector
