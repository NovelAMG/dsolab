# Source: microsoft-defender-for-containers/charts/microsoft-defender-for-containers-sensor/templates/daemonset-collectors.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
 name: microsoft-defender-collectors-ds
 namespace: mdc
 labels:
   app.kubernetes.io/name:  defender-k8s-sensor
   app.kubernetes.io/version:  0.10.36
   addonmanager.kubernetes.io/mode: Reconcile
   kubernetes.azure.com/managedby: aks
   tier: node
spec:
 updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
 selector:
   matchLabels:
     dsName: microsoft-defender-collectors-ds
 template:
  metadata:
   labels:
    app.kubernetes.io/name:  defender-k8s-sensor
    app.kubernetes.io/version:  0.10.36
    dsName: "microsoft-defender-collectors-ds"
    app: defender-k8s-sensor
    kubernetes.azure.com/managedby: aks
   annotations:
    schema-versions: "v1"
  spec:
   hostNetwork: true
   hostPID: true
   serviceAccountName: microsoft-defender-collectors-sa
   
   containers:

   - name: microsoft-defender-low-level-collectors
     image: "mcr.microsoft.com/azuredefender/stable/low-level-collector:2.2.18"
     imagePullPolicy: IfNotPresent
     
     securityContext:
       # AppArmor Unconfined: required for eBPF syscalls that default profiles block.
       appArmorProfile:
         type: Unconfined
       # Drop all capabilities, then add back only what eBPF-based collectors need.
       capabilities:
         drop:
           - all
         add:
           - SYS_ADMIN # eBPF program loading, cgroup/mount namespace ops
           - SYS_RESOURCE # Raise RLIMIT_MEMLOCK for eBPF ring buffers
           - SYS_PTRACE # Cross-namespace /proc access for process monitoring
           - SYSLOG # Read kernel log ring buffer
           - IPC_LOCK # mlock() to pin eBPF map memory
           - NET_ADMIN # Attach eBPF to network interfaces for DNS capture
           - NET_RAW # Raw socket access for DNS packet inspection   
     resources:
     
       limits:
         cpu: 330m
         memory: 280Mi
       requests:
         cpu: 150m
         memory: 128Mi
     env:
     - name: INFRASTRUCTURE
       value: "azure"    
     - name: MIN_LOGGER_LEVEL
       value: "debug"
     - name: LLC_EVENT_SENDER_SOCKET_NAME
       value: /tmp/mdc-ipc/antimalware.sock
     - name: HOST_ROOT
       value: /host
     - name: AZURE_RESOURCE_ID
       value: "/subscriptions/e406a385-feed-47ce-9194-13ed4f88f094/resourceGroups/rg-dsolab-sea/providers/Microsoft.ContainerService/managedClusters/aks-dsolab-sea"
     - name: AZURE_RESOURCE_REGION
       value: "southeastasia"
     - name: CLUSTER_DISTRIBUTION
       value: "aks"
     - name: CHART_VERSION
       value: "0.10.36"
     - name: IMAGE_VERSION
       value: "mcr.microsoft.com/azuredefender/stable/low-level-collector:2.2.18"
     - name: NODE_NAME
       valueFrom:
         fieldRef:
           fieldPath: spec.nodeName
     - name: ANTIMALWARE_COLLECTOR_ENABLED
       value: "true"
     - name: EXEC_COLLECTOR_ENABLED
       value: "true"
     - name: DNS_COLLECTOR_ENABLED
       value: "true"
     - name: FIM_COLLECTOR_ENABLED
       value: "true"
     volumeMounts:
       # Mount host root fs used by FIM for file monitoring and IG.
       - mountPath: /host
         name: host-root
         readOnly: true
       # Used by Exec collector for IPC communication with antimalware container
       - mountPath: /tmp/mdc-ipc
         name: mdc-ipc
       # Used by Exec collector to persist events
       - mountPath: /var/log/microsoft-defender-for-cloud/collectors/LowLevelCollector
         name: mdc-low-level-collectors-log
       # Used by Fim collector to persist events
       - mountPath: /var/log/microsoft-defender-for-cloud/collectors/FimCollector
         name: mdc-fim-collectors-log
       # Used by Dns collector to persist events
       - mountPath: /var/log/microsoft-defender-for-cloud/collectors/DnsCollector
         name: mdc-dns-collectors-log
       # Used by IG for CRI
       - mountPath: /run
         name: run
       # Used by instrumentation lib to persis metrics
       - mountPath: /var/log/microsoft-defender-for-cloud/metrics
         name: mdc-metrics-log
       # Used by instrumentation lib to persist traces
       - mountPath: /var/log/microsoft-defender-for-cloud/traces
         name: mdc-traces-log
       # Used by IG for kernel tracing
       - mountPath: /sys/kernel
         name: debugfs
       # Used by IG for bpf
       - mountPath: /sys/fs/bpf
         name: bpffs
       - name: ca-certs
         mountPath: /etc/ssl/certs
         readOnly: true
       - name: etc-pki-ca-certs
         mountPath: /etc/pki/ca-trust/extracted
         readOnly: true

   - name: microsoft-defender-pod-collector
     image: "mcr.microsoft.com/azuredefender/stable/pod-collector:1.0.248"
     imagePullPolicy: IfNotPresent
     
     
     securityContext:
       capabilities:
         drop:
           - all
         add:
           - NET_RAW
           - NET_ADMIN
     resources:
     
       limits:
         cpu: 60m
         memory: 200Mi
       requests:
         cpu: 30m
         memory: 32Mi
     env:
     - name: MIN_LOGGER_LEVEL
       value: "debug" 
     - name: WATCH_WINDOWS_NODES
       value: "false"
     - name: NODE_RESYNC_DURATION
       value: "1h"
     - name: NODE_NAME
       valueFrom:
         fieldRef:
           fieldPath: spec.nodeName
     - name: INFRASTRUCTURE
       value: "azure"      
     - name: COMPONENT_NAME
       value: "PodCollector"
     - name: CLUSTER_DISTRIBUTION
       value: "aks"
     - name: AZURE_RESOURCE_REGION
       value: "southeastasia"
     - name: AZURE_RESOURCE_ID
       value: "/subscriptions/e406a385-feed-47ce-9194-13ed4f88f094/resourceGroups/rg-dsolab-sea/providers/Microsoft.ContainerService/managedClusters/aks-dsolab-sea"
     - name: IMAGE_VERSION
       value: "mcr.microsoft.com/azuredefender/stable/pod-collector:1.0.248"
     - name: RESYNC_DURATION
       value: "1h"
     - name: CHART_VERSION
       value: "0.10.36"
     volumeMounts:
       - mountPath: /var/log/microsoft-defender-for-cloud/collectors/PodCollector
         name: mdc-podcollectors-log
       - mountPath: /var/log/microsoft-defender-for-cloud/metrics
         name: mdc-metrics-log
       - mountPath: /var/log/microsoft-defender-for-cloud/traces
         name: mdc-traces-log
       - name: ca-certs
         mountPath: /etc/ssl/certs
         readOnly: true
       - name: etc-pki-ca-certs
         mountPath: /etc/pki/ca-trust/extracted
         readOnly: true

   - name: microsoft-defender-antimalware-collector
     image: "mcr.microsoft.com/azuredefender/stable/anti-malware-collector:1.0.16"
     imagePullPolicy: IfNotPresent
     
     
     securityContext:
       privileged: true
       capabilities:
         drop:
           - all
         add: 
           - SYS_PTRACE
     resources:
     
         limits:
           cpu: 300m
           memory: 500Mi
         requests:
           cpu: 50m
           memory: 350Mi
     env:
     - name: MIN_LOGGER_LEVEL
       value: "debug" 
     - name: LLC_EVENT_SENDER_SOCKET_NAME
       value: /tmp/mdc-ipc/antimalware.sock
     - name: HOST_ROOT
       value: /host
     - name: AZURE_RESOURCE_ID
       value: "/subscriptions/e406a385-feed-47ce-9194-13ed4f88f094/resourceGroups/rg-dsolab-sea/providers/Microsoft.ContainerService/managedClusters/aks-dsolab-sea"
     - name: AZURE_RESOURCE_REGION
       value: "southeastasia"
     - name: CLUSTER_DISTRIBUTION
       value: "aks"
     - name: CHART_VERSION
       value: "0.10.36"
     - name: IMAGE_VERSION
       value: "mcr.microsoft.com/azuredefender/stable/anti-malware-collector:1.0.16"
     - name: NODE_NAME
       valueFrom:
         fieldRef:
           fieldPath: spec.nodeName
     volumeMounts:
       - mountPath: /tmp/mdc-ipc
         name: mdc-ipc
       - mountPath: /var/log/microsoft-defender-for-cloud/metrics
         name: mdc-metrics-log
       - mountPath: /var/log/microsoft-defender-for-cloud/traces
         name: mdc-traces-log
       - mountPath: /var/log/microsoft-defender-for-cloud/collectors/AntimalwareCollector
         name: mdc-amw-collectors-log
       - mountPath: /host
         name: host-root
         readOnly: true
   affinity:
    nodeAffinity:
     requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/os
          operator: In
          values:
          - linux
        - key: type
          operator: NotIn
          values:
          - virtual-kubelet
        - key: kubernetes.azure.com/cluster
          operator: Exists
   tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Exists"
    - operator: "Exists"
      effect: "NoSchedule"
    - operator: "Exists"
      effect: "NoExecute"
    - operator: "Exists"
      effect: "PreferNoSchedule"
# all the collector's volumes
   volumes:
   - name: host-root
     hostPath: 
       path: /
   - name: mdc-ipc
     emptyDir:
       medium: Memory
       sizeLimit: 16Mi
   - name: mdc-podcollectors-log
     hostPath:
       path: /var/log/microsoft-defender-for-cloud/collectors/PodCollector
   - name: mdc-dns-collectors-log
     hostPath:
       path: /var/log/microsoft-defender-for-cloud/collectors/DnsCollector
   - name: mdc-amw-collectors-log
     hostPath:
       path: /var/log/microsoft-defender-for-cloud/collectors/AntimalwareCollector
   - name: mdc-fim-collectors-log
     hostPath:
       path: /var/log/microsoft-defender-for-cloud/collectors/FimCollector
   - name: mdc-low-level-collectors-log
     hostPath:
       path: /var/log/microsoft-defender-for-cloud/collectors/LowLevelCollector
   - name: mdc-metrics-log
     hostPath:
       path: /var/log/microsoft-defender-for-cloud/metrics
   - name: mdc-traces-log
     hostPath:
       path: /var/log/microsoft-defender-for-cloud/traces
   - name: run
     hostPath:
       path: /run
   - name: bpffs
     hostPath:
       path: /sys/fs/bpf
   - name: debugfs
     hostPath:
       path: /sys/kernel
   - name: ca-certs
     hostPath:
       path: /etc/ssl/certs
       type: Directory
   - name: etc-pki-ca-certs
     hostPath:
       path: /etc/pki/ca-trust/extracted
       type: DirectoryOrCreate
---
