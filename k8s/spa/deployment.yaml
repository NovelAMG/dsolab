apiVersion: apps/v1
kind: Deployment
metadata:
  name: spa
  namespace: n8n
  labels:
    app: spa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spa
  template:
    metadata:
      labels:
        app: spa
    spec:
      securityContext:
        runAsUser: 101 # nginx user in the alpine image
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spa
          # Pinned to the digest of the cosign-signed build 316a76f (ADR-0017).
          # Required by Phase 3.7 vulnerability gate (ADR-0022): mutable :latest
          # tags can race with MDVA scan ingestion; digest makes the "this is
          # the bytes Defender scanned" assertion verifiable. CI deploy script
          # (scripts/09-deploy-spa-and-workflow.sh) substitutes the new digest
          # on each push.
          image: acrdsolabxsqb.azurecr.io/dsolab/spa@sha256:7cb64ec1f6fd0c847dee1e7e7eb0095d4633c16a0387a11ab5aabca1dbfe88fe
          imagePullPolicy: IfNotPresent # digest is immutable; no need to re-pull
          ports:
            - name: http
              containerPort: 8080
          # Container-level hardening — SPA is just nginx serving static
          # built assets. Nothing should be writing to the root FS at runtime;
          # nginx's own writable paths get tmpfs mounts. See ADR-0019.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            # seccompProfile is inherited from pod-level spec.securityContext
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      volumes:
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
