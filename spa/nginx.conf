server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback — every route serves index.html so React Router (or just
    # the SPA itself) can handle paths client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the HTML (so deploys propagate). Hashed JS/CSS can cache.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cheap healthcheck for K8s.
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
